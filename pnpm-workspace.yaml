# pnpm workspace — the seven published packages plus the dist-consumer check.
#
# The `catalog:` protocol pins versions that MUST be singletons across the
# workspace. Effect especially: two copies of `effect` break Context / Layer /
# Schema identity at runtime, so every package references `catalog:`.
#
# EVERY external dependency version lives here — package.json files reference
# only `catalog:` / `catalog:peers` (or `workspace:*` for internal packages).
# `catalogMode: strict` makes `pnpm add` enforce this at add time and
# `pnpm install` reject non-catalog specifiers. After editing this catalog,
# ALWAYS run `pnpm install` and commit the regenerated pnpm-lock.yaml — a stale
# lockfile fails CI at once with ERR_PNPM_LOCKFILE_CONFIG_MISMATCH.
#
# Versions are kept in lockstep with the preferenceflow application's catalog
# (the freshest of the three consumers) wherever the two overlap — effect,
# vite-plus, the TypeScript 6/7 pair, @effect/tsgo, fallow — so the library
# builds against exactly what the apps run.
packages:
  - packages/*
  - tests/*

catalogMode: strict

catalog:
  "@changesets/changelog-github": ^1.0.1
  "@changesets/cli": ^3.0.3
  # Compiles AND executes every JSDoc `@example` (`vp run -r docgen`); runs the
  # examples under `tsx`, hence that entry below (`runExamples: true` in each
  # package's docgen.json: 4.x defaults it to false). It never requires the
  # `typescript` package: it parses the sources with the TypeScript 6.0 that
  # ts-morph 28 bundles, and type-checks the examples by spawning the `tsc` on
  # PATH, which under `vp run` is the native, tsgo-patched TS7 binary from
  # `@typescript/native` (see the TS 6/7 note below). Pinned EXACT at the
  # `effect` version: docgen depends on `effect` (not a peer) with a floor
  # that rises patch-for-patch with it (4.0.1 needs `^4.0.1`), and the
  # `effect` override below forces that copy onto this catalog's singleton,
  # so a docgen ahead of `effect` would run on an older Effect than it was
  # built against. Dependabot's `effect` group proposes both in one PR when
  # both have a release, but picks each version on its own: the reviewer of
  # that PR checks both pins land on the same version (bump the lagging one
  # by hand if not).
  # Its `@effect/platform-node` dependency has a non-optional `redis` peer, so
  # pnpm auto-installs `redis` and `@redis/*`: unused, dev-only, and accepted
  # by the owner on #52.
  "@effect/docgen": 4.0.6
  "@effect/language-service": ^0.87.5
  # Effect Language Service as a native (TypeScript-Go) binary — the TS7 side
  # of the 6/7 split. `effect-tsgo patch` overwrites the native `tsc` binary
  # with an Effect-patched build matched by gitHead, so this pins in lockstep
  # with `@typescript/native` below.
  #
  # The root `prepare` script runs `effect-tsgo patch --typescript --oxlint`,
  # so this ALSO pins in lockstep with the `oxlint` that `vite-plus` pulls in
  # (see that entry). Each @effect/tsgo release ships artifacts for an explicit
  # set of component versions and hard-errors
  # (UnsupportedTargetPackageVersionError) on anything else, failing
  # `pnpm install` itself rather than a later task. Read the `components`
  # table in node_modules/@effect/tsgo/dist/effect-tsgo.cjs before bumping
  # any of the three. 0.55.0 ships against typescript 7.0.2, oxlint 1.87.0 –
  # 1.89.0 and tsgolint 7.0.2003 / 7.0.2004; vite-plus 1.3.0 carries oxlint
  # 1.88.0 and tsgolint 7.0.2004.
  "@effect/tsgo": 0.55.0
  "@mpsuesser/oxlint-plugin-effect": ^0.6.0
  "@types/node": ^26.6.5
  # The provider of the root `test:coverage` task, whose Istanbul map
  # `fallow audit` reads. Must equal the vitest that vite-plus bundles (see
  # `vitest` below); vite-plus refuses to run coverage on a mismatch.
  "@vitest/coverage-istanbul": 5.0.5
  # `@alchemy.run/cloudflare` and `alchemy` are dev-only, for packages/alchemy's
  # compile-time check that each binding builder's record satisfies
  # `Cloudflare.InferEnv` (#94). The published package keeps `alchemy` an
  # optional peer declared in `peerDependenciesMeta` only, so a consumer never
  # gets alchemy's tree from it. Pinned exact and moved together:
  # `@alchemy.run/cloudflare` peers on the exact same `alchemy` beta, and since
  # beta.84 the Cloudflare provider is that separate package, no longer
  # `alchemy/Cloudflare`. beta.84 is the first whose tree passes `pnpm audit
  # --audit-level high` (beta.83 pulled `@prisma/dev`, which pins vulnerable
  # hono / @hono/node-server / lodash; see #82). Their `effect` peer (^4.0.5)
  # must admit the `effect` pin below.
  "@alchemy.run/cloudflare": 2.0.0-beta.84
  alchemy: 2.0.0-beta.84
  effect: 4.0.6
  fallow: 3.34.1
  # The runtime `@effect/docgen` executes examples under.
  tsx: ^4.23.13
  # TypeScript 6/7 side-by-side: TS7 (the native Go compiler) ships no JS API
  # until 7.1, so JS-API consumers (@effect/language-service) stay on TS6
  # while native `tsc` type-checks; `vp pack` (tsdown) emits `dist/` and its
  # bundled declarations. The alias keeps the package importable as
  # `typescript` name-stable at the TS6 JS compiler (bin `tsc6`);
  # `@typescript/native` is TS7 (bin `tsc`). Pinned exact: @typescript/native's
  # gitHead must match @effect/tsgo's bundled binary.
  typescript: "npm:@typescript/typescript6@6.0.2"
  "@typescript/native": "npm:typescript@7.0.2"
  # vite-plus pins `oxlint`, `oxfmt` and `vitest` to exact versions; `vite` is
  # the same release under its aliased core package, and `vitest` must match
  # vite-plus's exact pin because the `vitest: "catalog:"` override forces
  # every resolution to the catalog singleton. This entry — not a catalog
  # entry of its own — decides the oxlint version `effect-tsgo patch --oxlint`
  # has to support (see the @effect/tsgo note): check that the oxlint a new
  # vite-plus carries is in the pinned @effect/tsgo's `components` table
  # before bumping. 1.x moved to vitest 5 and moved a task's `env` / `input`
  # / `output` under `cache` (vite.package.ts). 1.0.1 or later is required:
  # 1.0.0 and older bundle a launch-editor with GHSA-587h-7wmj-h5pm (high).
  vite-plus: 1.3.0
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vitest: 5.0.5

# Peer ranges the PUBLISHED packages declare. Kept as a named catalog so the
# strict catalog mode still governs them while they stay ranges (an exact
# `4.0.0-rc.118` peer would reject a consumer on a later release). `pnpm pack` replaces
# `catalog:peers` with these ranges in the published manifest.
catalogs:
  peers:
    effect: ">=4.0.0-rc.118"

overrides:
  # undici <8.12.2 — GHSA-xjj6-f33q-929c (high): an unhandled error on a
  # response with excessive content-encodings is a denial of service
  # (#95). Reached transitively (@effect/platform-node > undici), whose
  # range admits the fix but whose lockfile resolution stayed below it.
  # Drop once that resolution reaches >=8.12.2 on its own.
  undici: ^8.12.2
  vite: "catalog:"
  vitest: "catalog:"
  # `effect` MUST be a singleton (see the header): force every resolution to
  # the catalog version so a hoisting reshuffle cannot introduce a second copy.
  effect: "catalog:"
  # TEMPORARY (#50): security floor for shell-quote GHSA-pqg4-j6r4-53mv
  # (critical), a dev-only transitive package that `pnpm audit --audit-level
  # high` (CI's Audit step) flags, via @changesets/cli > launch-editor. Even the
  # latest launch-editor declares `^1.10.0`, which admits the vulnerable 1.10.x,
  # so no parent bump fixes it. The override is scoped to that one parent and
  # stays inside its declared range, so it only lifts the locked version and
  # never reaches the published packages. Remove once launch-editor requires
  # 1.11.0 or later.
  "launch-editor>shell-quote": ^1.11.0
  # TEMPORARY: security floor for launch-editor GHSA-587h-7wmj-h5pm (high),
  # dev-only, via @changesets/cli, whose declared range still admits the
  # vulnerable versions. Remove once @changesets/cli requires 2.14.2 or later.
  "@changesets/cli>launch-editor": ^2.14.2
nodeLinker: hoisted
allowBuilds:
  esbuild: true
  fallow: true
  # workerd (via @alchemy.run/cloudflare, dev-only for #94's type checks)
  # downloads the local Workers runtime in its install script. Nothing here
  # runs a Worker, so the download is skipped.
  workerd: false
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
    # @effect/docgen's `tsconfck` declares an optional `typescript ^5.0.0` peer
    # that only its `parseNative` uses; docgen calls `parse` alone, which reads
    # tsconfig files without the compiler, so this only silences the peer
    # warning against the TS6 alias.
    "tsconfck>typescript": "6"

# Supply-chain delay (owner's policy, gardeneria #1149): hold newly published
# versions for 1 day (unit: MINUTES) before pnpm will install them.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  # @thomasfosterau/* is first-party — exempt so our own releases install immediately.
  - "@thomasfosterau/*"
