# pnpm workspace — the three published packages plus the dist-consumer check.
#
# The `catalog:` protocol pins versions that MUST be singletons across the
# workspace. Effect especially: two copies of `effect` break Context / Layer /
# Schema identity at runtime, so every package references `catalog:`.
#
# EVERY external dependency version lives here — package.json files reference
# only `catalog:` / `catalog:peers` (or `workspace:*` for internal packages).
# `catalogMode: strict` makes `pnpm add` enforce this at add time and
# `pnpm install` reject non-catalog specifiers. After editing this catalog,
# ALWAYS run `pnpm install` and commit the regenerated pnpm-lock.yaml — a stale
# lockfile fails CI at once with ERR_PNPM_LOCKFILE_CONFIG_MISMATCH.
#
# Versions are kept in lockstep with the preferenceflow application's catalog
# (the freshest of the three consumers) wherever the two overlap — effect,
# vite-plus, the TypeScript 6/7 pair, @effect/tsgo, fallow — so the library
# builds against exactly what the apps run.
packages:
  - packages/*
  - tests/*

catalogMode: strict

catalog:
  "@changesets/changelog-github": ^1.0.1
  "@changesets/cli": ^3.0.3
  # Compiles AND executes every JSDoc `@example` (`vp run -r docgen`); runs the
  # examples under `tsx`, hence that entry below. It never requires the
  # `typescript` package: its bin bundles its own TypeScript 5.5 (via ts-morph)
  # to parse the sources, and type-checks the examples by spawning the `tsc` on
  # PATH, which under `vp run` is the native, tsgo-patched TS7 binary from
  # `@typescript/native` (see the TS 6/7 note below). The 0.5 line, not the 4.0
  # rc line: the rc line depends on a newer `effect` than the catalog pins, and
  # the `effect` override below would force it onto this one.
  "@effect/docgen": ^0.5.2
  "@effect/language-service": ^0.87.3
  # Effect Language Service as a native (TypeScript-Go) binary — the TS7 side
  # of the 6/7 split. `effect-tsgo patch` overwrites the native `tsc` binary
  # with an Effect-patched build matched by gitHead, so this pins in lockstep
  # with `@typescript/native` below.
  #
  # The root `prepare` script runs `effect-tsgo patch --typescript --oxlint`,
  # so this ALSO pins in lockstep with the `oxlint` that `vite-plus` pulls in
  # (see that entry). Each @effect/tsgo release ships artifacts for an explicit
  # set of component versions and hard-errors
  # (UnsupportedTargetPackageVersionError) on anything else, failing
  # `pnpm install` itself rather than a later task. Read the `components`
  # table in node_modules/@effect/tsgo/dist/effect-tsgo.cjs before bumping
  # any of the three.
  "@effect/tsgo": 0.46.1
  "@mpsuesser/oxlint-plugin-effect": ^0.5.0
  "@types/node": ^26.6.3
  effect: 4.0.0-rc.118
  effect-solutions: ^0.5.3
  fallow: 3.30.0
  # The runtime `@effect/docgen` executes examples under.
  tsx: ^4.23.13
  # TypeScript 6/7 side-by-side: TS7 (the native Go compiler) ships no JS API
  # until 7.1, so JS-API consumers (@effect/language-service) stay on TS6 while
  # native `tsc` type-checks; `vp pack` (tsdown) emits `dist/` and its bundled
  # declarations. The alias keeps
  # the package importable as `typescript` name-stable at the TS6 JS compiler
  # (bin `tsc6`); `@typescript/native` is TS7 (bin `tsc`). Pinned exact:
  # @typescript/native's gitHead must match @effect/tsgo's bundled binary.
  typescript: "npm:@typescript/typescript6@6.0.2"
  "@typescript/native": "npm:typescript@7.0.2"
  # vite-plus pins `oxlint`, `oxfmt` and `vitest` to exact versions; `vite` is
  # the same release under its aliased core package, and `vitest` must match
  # vite-plus's exact pin because the `vitest: "catalog:"` override forces
  # every resolution to the catalog singleton. This entry — not a catalog
  # entry of its own — decides the oxlint version `effect-tsgo patch --oxlint`
  # has to support (see the @effect/tsgo note): check that the oxlint a new
  # vite-plus carries is in the pinned @effect/tsgo's `components` table
  # before bumping.
  vite-plus: 0.3.2
  vite: npm:@voidzero-dev/vite-plus-core@0.3.2
  vitest: 4.1.11

# Peer ranges the PUBLISHED packages declare. Kept as a named catalog so the
# strict catalog mode still governs them while they stay ranges (an exact
# `4.0.0-rc.118` peer would reject a consumer on a later release). `pnpm pack` replaces
# `catalog:peers` with these ranges in the published manifest.
catalogs:
  peers:
    effect: ">=4.0.0-rc.118"

overrides:
  vite: "catalog:"
  vitest: "catalog:"
  # `effect` MUST be a singleton (see the header): force every resolution to
  # the catalog version so a hoisting reshuffle cannot introduce a second copy.
  effect: "catalog:"
  # TEMPORARY (owner decision, website#2015): @mpsuesser/oxlint-plugin-effect
  # 0.5.0 is built on effect 4.0.0-beta.100 and calls `Schema.isIncludes`,
  # which rc.118 renamed to `isIncluding`, so the `effect` override above would
  # break vite.config.ts at load. This scoped override keeps the plugin (a lint
  # tool only; nothing it loads reaches the published packages) on its own
  # Effect. Remove it once the plugin ships an rc.118 build.
  "@mpsuesser/oxlint-plugin-effect>effect": 4.0.0-beta.100
nodeLinker: hoisted
allowBuilds:
  esbuild: true
  fallow: true
  # The plugin override's private effect@4.0.0-beta.100 pulls in
  # `msgpackr-extract`, a native build. Its build approval is declared
  # explicitly so `pnpm install --frozen-lockfile` does not exit 1 on an
  # unreviewed build script; the package is an optional msgpack accelerator
  # that nothing here uses, so the build is not needed. Remove with the
  # plugin override above.
  msgpackr-extract: false
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
    # @effect/docgen declares a `typescript ^5.2.2` peer it never requires (see
    # its catalog entry: it bundles its own TypeScript and spawns `tsc`), so
    # this only silences the peer warning against the TS6 alias.
    "@effect/docgen>typescript": "6"

# Supply-chain delay (owner's policy, gardeneria #1149): hold newly published
# versions for 1 day (unit: MINUTES) before pnpm will install them.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  # @thomasfosterau/* is first-party — exempt so our own releases install immediately.
  - "@thomasfosterau/*"
