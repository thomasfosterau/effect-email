name: Release

on:
  push:
    branches: [trunk]

concurrency:
  group: release-${{ github.ref }}

# No permissions by default; the release job opts into exactly what it needs.
permissions: {}

jobs:
  release:
    name: Version or publish
    # Never run on forks (they have neither the environment nor the trusted
    # publisher binding, so a fork cannot publish on your behalf).
    if: github.repository == 'thomasfosterau/effect-email'
    runs-on: ubuntu-latest
    # Requires manual approval via a protected GitHub Environment named
    # "release". See PUBLISHING.md for the one-time setup.
    environment: release
    permissions:
      contents: write # push the version commit/tag and the "Version Packages" PR branch
      pull-requests: write # open/update the "Version Packages" PR
      id-token: write # OIDC: prove this workflow's identity to npm (no token needed)
    env:
      # pnpm 11 defaults `verify-deps-before-run` to `install`: before any
      # `pnpm run` / `pnpm exec` it compares node_modules with the manifests
      # and, if a manifest looks newer than the last install, re-installs
      # WITH lifecycle scripts, ignoring the `--ignore-scripts` of the install
      # step below. That re-install runs the root `prepare` (`vp config` +
      # `effect-tsgo patch`) and every `allowBuilds` dependency's build script
      # inside this job, which holds `id-token: write`. It triggers whenever
      # a manifest's mtime moves after the install step, e.g. when the
      # Changesets action checks out an existing `changeset-release/trunk`
      # and `git reset --hard`s it back before `pnpm run version` (with this
      # job's shallow checkout the action does not see the existing branch
      # today, but a `fetch-depth: 0` checkout would). The top-level
      # `pnpm run` calls are the entry points: commands nested inside a
      # `pnpm run` script (scripts/release.sh's `pnpm exec changeset tag`)
      # already inherit `pnpm_config_verify_deps_before_run=false` from pnpm.
      # Scoped to this job: CI and local runs keep the default. pnpm 11 reads
      # only the `pnpm_config_*` spelling for this setting;
      # `npm_config_verify_deps_before_run` is ignored.
      pnpm_config_verify_deps_before_run: "false"
    steps:
      - name: Checkout
        # The Changesets action pushes the version branch, so it needs the
        # checkout's git credentials (the ephemeral, job-scoped GITHUB_TOKEN).
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs the pnpm version pinned by the package.json "packageManager"
      # field. Must run before setup-node so its pnpm cache can find the store.
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # scripts/release.sh publishes each `pnpm pack` tarball with the npm CLI
      # (`npm publish`), and npm's own OIDC trusted publishing needs
      # npm >= 11.5.1, which Node 22 (the family's release runtime, as in
      # effect-web) does not bundle. This step pins an exact, reviewed
      # version so what runs in this id-token job is known, rather than
      # whatever the registry serves on the day (`@latest` is already npm 12). Bump it by hand; Dependabot does
      # not see it.
      - name: Upgrade npm (OIDC trusted publishing)
        run: npm install -g npm@11.20.0

      # --ignore-scripts stops a compromised dependency from running install
      # scripts in the privileged publish job (the Shai-Hulud vector). That
      # only holds because `pnpm_config_verify_deps_before_run` is off for
      # this job (see the job `env` above); otherwise a later `pnpm run` /
      # `pnpm exec` could re-install with scripts. It also skips the tsgo
      # patch (`prepare`), which the build doesn't need: `vp pack` (tsdown)
      # emits `dist/`, and the patch only adds type-checker diagnostics.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build
        run: pnpm run build

      # When changesets are pending, this opens/updates a "Version Packages" PR
      # (via `pnpm run version`). Once that PR is merged (no changesets remain),
      # it runs `pnpm run release` (scripts/release.sh), which packs each
      # package with `pnpm pack` and publishes it with `npm publish` (OIDC
      # trusted publishing — there is no NPM_TOKEN to steal) and then
      # `changeset tag`. The action parses the "New tag:" output, pushes the
      # tags and creates the GitHub releases.
      #
      # Provenance is left to npm: with no explicit provenance setting, npm
      # (>= 11.5.1, under trusted publishing) attaches it only when the OIDC
      # token reports a public repository AND the registry reports the
      # package as public. This repository is private, so there is no
      # provenance today. Do not force it: `NPM_CONFIG_PROVENANCE=true` or
      # `--provenance` is read by the npm CLI and makes the publish FAIL from
      # a private repository.
      #
      # v2 of the action pairs with Changesets CLI v3 (`@changesets/cli` in
      # devDependencies) and renamed its inputs from v1's `version` / `publish`
      # / `commit` / `title`.
      - name: Create release PR or publish to npm
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm run version
          publish-script: pnpm run release
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
