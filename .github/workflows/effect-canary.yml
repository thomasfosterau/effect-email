name: Effect Canary

# Runs the gate against the newest Effect release (the `latest` npm dist-tag)
# instead of the version pinned in pnpm-workspace.yaml / pnpm-lock.yaml, so
# upstream breakage surfaces here on a schedule rather than in a consumer's
# build.
#
# Scheduled + manual only — this never runs on push or pull_request, so a red
# run can never block a PR merge. The job still finishes red in the Actions
# tab (see the final step) and files/refreshes a GitHub issue, because nobody
# watches the Actions tab for a weekly cron.
on:
  schedule:
    # Mondays at 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

concurrency:
  group: effect-canary-${{ github.ref }}
  cancel-in-progress: true

# No permissions by default; the single job grants only what it needs.
permissions: {}

jobs:
  canary:
    name: Typecheck, test & build against effect@latest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # to file/refresh the failure-notification issue
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Float the catalog's `effect` pin onto the newest release. The
      # workspace runs `catalogMode: strict`, so `pnpm add effect@latest` is
      # refused; the catalog entry itself is what moves. It is pinned to the
      # exact version the `latest` dist-tag names (not the bare tag), so the
      # log records which release was tested. Since 4.0.0 shipped, `latest` is
      # the line this repo tracks; the `rc` tag no longer moves.
      # Only the `catalog:` block is rewritten: the `effect: "catalog:"`
      # singleton override already follows it, and the `catalogs.peers` floor
      # is the published range, not what the canary installs.
      # `minimumReleaseAge` still applies, so a release younger than a day
      # fails the install loudly.
      - name: Float the catalog onto the latest Effect release
        run: |
          set -euo pipefail
          latest="$(npm view effect@latest version)"
          echo "effect@latest is $latest"
          sed -i -E "/^catalog:/,/^[^ #]/ s/^(  effect: ).*$/\1$latest/" pnpm-workspace.yaml
          grep -n '^  effect: ' pnpm-workspace.yaml

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: pnpm

      # NOT frozen: the floated catalog entry no longer matches the lockfile,
      # which is the point. `minimumReleaseAge` still applies.
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # The three checks most likely to catch an Effect API/behaviour break.
      # Lint and formatting are deliberately skipped: they have nothing to do
      # with the Effect version and would only add unrelated noise to a
      # canary result. Each step runs even if an earlier one fails, so a
      # single run reports typecheck/test/build status independently.
      - name: Type-check (packages + emitted declarations)
        id: typecheck
        continue-on-error: true
        run: pnpm exec vp run --concurrency-limit 2 check

      - name: Test
        id: test
        continue-on-error: true
        run: pnpm exec vp run -r test:unit

      - name: Build
        id: build
        continue-on-error: true
        run: pnpm exec vp run -r build

      - name: Open or refresh an issue if the canary is red
        if: |
          steps.typecheck.outcome == 'failure' ||
          steps.test.outcome == 'failure' ||
          steps.build.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          set -euo pipefail

          title="Effect canary is red against effect@latest"

          body=$(jq -n \
            --arg run "$RUN_URL" \
            --arg typecheck "$TYPECHECK_OUTCOME" \
            --arg test "$TEST_OUTCOME" \
            --arg build "$BUILD_OUTCOME" \
            '"The scheduled Effect canary failed against the latest `effect` release (the `latest` npm dist-tag).\n\n" +
             "- typecheck: " + $typecheck + "\n" +
             "- test: " + $test + "\n" +
             "- build: " + $build + "\n\n" +
             "Run: " + $run + "\n\n" +
             "This does not block any PR by itself — it means the newest Effect release breaks this library, so the next catalog bump will too. Investigate the run, then either fix the break ahead of time or close this out if it turns out to be a fluke in that release."')

          existing=$(curl -sS -G \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            --data-urlencode "q=repo:$REPO type:issue state:open in:title \"$title\"" \
            "https://api.github.com/search/issues" | jq -r '.items[0].number // empty')

          if [ -n "$existing" ]; then
            curl -sS -X POST \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/issues/$existing/comments" \
              -d "{\"body\": $body}"
          else
            payload=$(jq -n --arg title "$title" --argjson body "$body" '{title: $title, body: $body}')
            curl -sS -X POST \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/issues" \
              -d "$payload"
          fi

      # continue-on-error above keeps the job running through all three
      # checks so the issue body above has full information; this step turns
      # that into a real (visible, red) job failure once we're done.
      - name: Fail the job if any check failed
        if: |
          steps.typecheck.outcome == 'failure' ||
          steps.test.outcome == 'failure' ||
          steps.build.outcome == 'failure'
        run: exit 1
