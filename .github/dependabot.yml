# Dependabot version-update configuration (a subset of the preferenceflow
# application's, whose catalog this workspace mirrors; the ignore set follows
# effect-jsonapi's).
#
# `groups` collect dependencies that MUST move together: the Effect 4 release
# line is a lockstep-versioned singleton set. The group lists its members
# explicitly rather than `@effect/*`, so `@effect/tsgo` stays out of it.
#
# Hand-moved sets: every entry under `ignore` is scoped to the
# `version-update:semver-*` update types, so SECURITY updates stay enabled (a
# bare `dependency-name` ignore would block them too).
# - `@effect/tsgo`, `@typescript/native` and `typescript` (the TS6 alias) pin
#   to each other by gitHead, and `effect-tsgo patch --typescript --oxlint`
#   (the root `prepare` script) hard-errors at install on any pairing it ships
#   no artifact for, including the oxlint that `vite-plus` carries. They move
#   by hand as a set, with `vite-plus`, after checking the pinned tsgo's
#   `components` table in node_modules/@effect/tsgo/dist/effect-tsgo.cjs (see
#   the `@effect/tsgo` note in pnpm-workspace.yaml).
# - The vite-plus trio (`vite-plus`, `vite` — its aliased core package — and
#   `vitest`, which must match vite-plus's exact pin) moves by hand together.
#
# `@effect/docgen` is in the `effect` group, not ignored: it depends on
# `effect` (not a peer) with a floor that rises patch-for-patch with it (4.0.1
# needs `^4.0.1`), and pnpm-workspace.yaml pins it exact at the catalog's
# `effect` version. The group proposes both in one PR when both have a
# release, but Dependabot still picks each version on its own and the two
# publish hours apart, so the reviewer of that PR checks both pins land on the
# same version and bumps the lagging one by hand if not.
#
# `cooldown` mirrors pnpm-workspace.yaml's `minimumReleaseAge`.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
    cooldown:
      default-days: 1
      exclude:
        - "@thomasfosterau/*"
    groups:
      effect:
        patterns:
          - "effect"
          - "@effect/docgen"
          - "@effect/language-service"
    ignore:
      # The tsgo set: moves by hand, with vite-plus (see the header).
      - dependency-name: "@effect/tsgo"
        update-types:
          [
            "version-update:semver-major",
            "version-update:semver-minor",
            "version-update:semver-patch",
          ]
      - dependency-name: "typescript"
        update-types:
          [
            "version-update:semver-major",
            "version-update:semver-minor",
            "version-update:semver-patch",
          ]
      - dependency-name: "@typescript/native"
        update-types:
          [
            "version-update:semver-major",
            "version-update:semver-minor",
            "version-update:semver-patch",
          ]
      # The vite-plus trio: moves by hand (see the header).
      - dependency-name: "vite"
        update-types:
          [
            "version-update:semver-major",
            "version-update:semver-minor",
            "version-update:semver-patch",
          ]
      - dependency-name: "vitest"
        update-types:
          [
            "version-update:semver-major",
            "version-update:semver-minor",
            "version-update:semver-patch",
          ]
      - dependency-name: "vite-plus"
        update-types:
          [
            "version-update:semver-major",
            "version-update:semver-minor",
            "version-update:semver-patch",
          ]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "ci"
      include: "scope"
