# Dependabot version updates. The `npm` ecosystem at `/` reads the pnpm
# workspace, including the catalogs in pnpm-workspace.yaml.
#
# Groups exist only for sets that must move in ONE pull request because
# updating one member without the others breaks the install or the build.
# Everything else (each action, `@changesets/*`, `@enfect/oxlint`, …) updates
# in a PR of its own. Dependabot puts a dependency in the FIRST group whose
# patterns match, and `exclude-patterns` keeps each package out of a group it
# does not belong to:
#
# - `toolchain`: vite-plus pins the `vite` core, `vitest`, `oxlint`, `oxfmt`
#   and `oxlint-tsgolint` it carries (exact); `@effect/tsgo`,
#   `@typescript/native` and `typescript` (the TS6 alias,
#   `@typescript/typescript6`) pin to each other by gitHead; and the root
#   `prepare` (`effect-tsgo patch --typescript --oxlint`) hard-errors at
#   install on any TS / oxlint pairing the pinned tsgo ships no artifact for.
#   `@vitest/coverage-istanbul` must equal vite-plus's vitest. All of them,
#   majors included, are one PR. Its reviewer checks the `components` table
#   in node_modules/@effect/tsgo/dist/effect-tsgo.cjs covers the proposed
#   pairing (see the `@effect/tsgo` note in pnpm-workspace.yaml); if it does
#   not, `pnpm install` fails in CI and the set is fixed by hand on that PR.
#   `@enfect/oxlint` is not in it: it takes `@oxlint/plugins` as a caret
#   range, not vite-plus's exact oxlint.
# - `effect`: the Effect 4 release line is a lockstep-versioned singleton set,
#   and `@effect/docgen` / `@effect/vitest` are pinned exact at the `effect`
#   version (docgen depends on `effect` with a floor that rises
#   patch-for-patch). Dependabot picks each version on its own, so the
#   reviewer checks they land on the same version and bumps the lagging one
#   by hand if not. `@effect/tsgo` belongs to `toolchain`, hence the
#   exclusion.
# - `alchemy`: `alchemy` and `@alchemy.run/cloudflare` are pinned exact to the
#   same beta (the Cloudflare provider peers on that exact `alchemy`). They are
#   effect-connect-alchemy-cloudflare's required peers too: the group moves
#   only the dev pins, so move `catalogs.alchemy-peers` (and its `effect`
#   floor, if the provider's `effect` peer rose) by hand on the same PR.
#
# By hand, because Dependabot cannot do them:
# - the `vite` npm alias (`npm:@voidzero-dev/vite-plus-core@<v>`) must equal
#   `vite-plus`; set it on the toolchain PR (or run `vp migrate` there).
# - `typescript` (`npm:@typescript/typescript6@<v>`) and `@typescript/native`
#   (`npm:typescript@<v>`) move only to a pairing the pinned `@effect/tsgo`
#   supports.
# - the `overrides`-only security floors in pnpm-workspace.yaml (`undici`,
#   `launch-editor>shell-quote`, `@changesets/cli>launch-editor`) are removed
#   once their parent requires the fixed version; see each one's comment.
# - the npm version the Release workflow installs (release.yml).
# - the `ghcr.io/voidzero-dev/vite-plus:<tag>` image in .devcontainer/devcontainer.json:
#   it equals the catalog's `vite-plus` pin, moved on the toolchain PR.
#
# `cooldown` is 1 day (Dependabot takes whole days only), longer than
# pnpm-workspace.yaml's 8-hour `minimumReleaseAge` (480 minutes), so a
# Dependabot PR never proposes a version pnpm would still refuse. Same
# `@thomasfosterau/*` exemption as `minimumReleaseAgeExclude`.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
    cooldown:
      default-days: 1
      exclude:
        - "@thomasfosterau/*"
    groups:
      # vite-plus pins vitest / oxlint exactly; @effect/tsgo's patch supports
      # only listed TS / oxlint versions.
      toolchain:
        applies-to: version-updates
        patterns:
          - "vite-plus"
          - "vite"
          - "vitest"
          - "@vitest/*"
          - "@effect/tsgo"
          - "@typescript/native"
          - "typescript"
          - "@typescript/typescript6"
        update-types: ["major", "minor", "patch"]
      # One release train; docgen / vitest pinned exact at the effect version.
      effect:
        applies-to: version-updates
        patterns:
          - "effect"
          - "@effect/*"
        exclude-patterns:
          - "@effect/tsgo"
        update-types: ["major", "minor", "patch"]
      # The Cloudflare provider peers on the exact same alchemy beta.
      alchemy:
        applies-to: version-updates
        patterns:
          - "alchemy"
          - "@alchemy.run/*"
        update-types: ["major", "minor", "patch"]
  - package-ecosystem: "github-actions"
    # `/` covers .github/workflows only; the local composite action lists its
    # own directory, or its pins drift from the workflows'.
    directories:
      - "/"
      - "/.github/actions/setup"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    cooldown:
      default-days: 1
  # The dev container's features (.devcontainer/devcontainer.json) and their
  # lockfile. The base image tag is not a feature: it is the catalog's
  # `vite-plus` pin, moved by hand on the toolchain PR.
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
    cooldown:
      default-days: 1
