# zizmor (GitHub Actions static analysis) configuration. Run it with
# `uvx zizmor --offline .github`; the workflows and the setup action report no
# findings beyond what is configured away here, each with its reason.
rules:
  dependabot-cooldown:
    config:
      # The owner's supply-chain policy: pnpm holds a new version for 8 hours
      # (`minimumReleaseAge: 480` in pnpm-workspace.yaml) and Dependabot's
      # cooldown, which counts whole days, waits 1, longer than pnpm, so a
      # Dependabot PR never proposes a version pnpm would refuse.
      days: 1
  self-repository:
    # `./.github/actions/setup` is the documented local-action path; the
    # `$/` spelling buys nothing for a single-repo composite action.
    disable: true
  artipacked:
    ignore:
      # The Release job's checkout keeps its credentials on purpose: the
      # Changesets action pushes the version branch and tags with the
      # job-scoped GITHUB_TOKEN (see the comment on that step). The job
      # uploads no artifacts and never runs for Dependabot or a fork.
      - release.yml
  adhoc-packages:
    ignore:
      # An exact, reviewed npm (OIDC trusted publishing needs >= 11.5.1,
      # which Node 22 does not bundle); bumped by hand, see the step comment.
      - release.yml
